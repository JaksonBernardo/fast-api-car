version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=car_api_db
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_PORT=3306
      - DB_NAME=car_api
      - DATABASE_URL=mysql+aiomysql://root:root123@car_api_db:3306/car_api
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=30
    volumes:
      - ./car_api:/app/car_api
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    networks:
      - car-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  car-api:
    external: true

volumes:
  mysql_data:
    driver: local
