version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-carapi}
      - DB_PASSWORD=${DB_PASSWORD:-carapi_password}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-car_api}
      - DATABASE_URL=mysql+aiomysql://${DB_USER:-carapi}:${DB_PASSWORD:-carapi_password}@db:${DB_PORT:-3306}/${DB_NAME:-car_api}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-30}
    volumes:
      - ./car_api:/app/car_api
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    networks:
      - car_api_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: car_api_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${DB_NAME:-car_api}
      - MYSQL_USER=${DB_USER:-carapi}
      - MYSQL_PASSWORD=${DB_PASSWORD:-carapi_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - car_api_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  car_api_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
